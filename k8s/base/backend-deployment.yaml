apiVersion: apps/v1
kind: Deployment
metadata:
  name: amdox-backend
  labels:
    app: amdox-backend
spec:
  replicas: 10 # Initial baseline
  selector:
    matchLabels:
      app: amdox-backend
  template:
    metadata:
      labels:
        app: amdox-backend
    spec:
      containers:
      - name: backend
        image: amdox/backend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amdox-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: amdox-backend
  minReplicas: 10
  maxReplicas: 1000 # Planetary Scale
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
